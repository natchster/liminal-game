# The fog (docs/CUTSCENES.md, C7): the self-assembly takes you. You sink
# into it, lying back, the violet closing over your eyes, then black, and
# the card. 1.4 s; on a repeat it starts sinking.
id = "death_fog"
about = "The fog takes you: sinking into the violet, black"
world = "live"
then = "card"
skip = "never"
breaks_off = false
length = 1.4
blend_in = 0.0
blend_out = 0.0
repeat_from = 0.4
stages = ["death:fog"]

[bars]
in = 0.3
out = 1.4

[[camera]]
t = 0.0
anchor = "start"

# sinking
[[camera]]
t = 0.7
anchor = "eyes"
pos = [0.0, -0.6, 0.0]
pitch = -6
ease = "in"
jolt = true

# lying back in it, looking up into the violet
[[camera]]
t = 1.3
anchor = "eyes"
pos = [0.0, -1.25, 0.2]
pitch = 18
roll = 10
ease = "out"
jolt = true

# the violet closing over, to its darkest (a veil's colour does not change
# under way: one fade, violet near black)
[[fade]]
t = 0.3
to = 1.0
over = 1.0
colour = "#160d1e"
