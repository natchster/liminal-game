# Where NAME may lie, and why (docs/design/ASSETS.md, *Placement rules*).
# Every rule is one way it comes to be somewhere; its `why` is the story a
# player could tell.

# by = "layout"  # made by the floor's layout where its plan has one (a door), not put down by
#                # the placement pass: each rule says `at` (where in the layout) for `on`/`near`,
#                # and `levels` may start at 1 (docs/design/ASSETS.md, *Things the layout makes*)
count = [0, 0]   # how many a floor: least (its maker makes them), most (the rest are dropped)
levels = [5, 99] # from which floor down (4 at the least: the Building's floors place their own)

[[rule]]
on = "floor"           # floor | surface (hung on a wall: not yet)
near = "wall"          # (floor) wall | corner | open
# of = ["core_filing_cabinet"]   # (surface) the kinds it stands on
purposes = ["*"]       # the zone purposes it fits, "*" any
# dark = true          # only where the place has no light of its own
weight = 1
why = ""

[never]
purposes = ["empty"]
why = "the emptiness is the content (PILLARS 1)"
