class = "limited"
licence = "Osram Sylvania, all rights reserved"
sampled = false
sha1 = ""
notes = "Limited: looked at only, no SHA-1. Read in the PDF text. H33GL-400/DX: 400 W, BT-37 bulb, mogul base, MOL 11-1/2 in, LCL 7 in, 'Brite White Deluxe' coating. The outer bulb is borosilicate (hard) glass, its inner surface coated with a white phosphor; the brass base has a date-recording feature. 'The first high-pressure mercury lamp, similar to the ones used today, was introduced in 1934 in the 400-watt size.' Bulb designations give the maximum diameter in eighths of an inch."

