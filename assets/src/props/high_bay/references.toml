[[ref]]
url = "https://www.americanradiohistory.com/Archive-Catalogs/Graybar/Graybar-Condensed-Catalog-29-1970.pdf"
page = "https://www.americanradiohistory.com/Archive-Catalogs/Graybar/Graybar-Condensed-Catalog-29-1970.pdf"
shows = "a maker's sheet of the era: Graybar Electric Condensed Catalog No. 29 (1970), mercury luminaires: p. 120 Day-Brite Industra 400 W reflectors (Alzak aluminium and porcelain enamel), p. 121 Holophane Prismpack II and Hibay with dimensions"
class = "limited"
licence = "Graybar Electric Company, all rights reserved (1970 catalogue, scanned by americanradiohistory.com)"
sampled = false
sha1 = ""
notes = "Limited: looked at only, no SHA-1. Read in the PDF text (OCR) and from rendered images of PDF pp. 132-133 (printed 120-121). Day-Brite Industra: extruded aluminium power pack (prewired ballast) over the reflector; 22-1/2 in Alzak (anodised aluminium) reflectors, plain or louvred, or 15 and 21 in porcelain enamel, louver rings and wire guards optional. Holophane Hibay: 'two-piece construction consisting of ventilated socket yoke and covered reflector assembly'. Prismpack II: integral ballast over a prismatic reflector. 'Depth' is the catalogue's column; whether it includes the ballast or yoke is not said (unverified)."

[[ref]]
url = "https://acomee.com.mx/catalogos/catalogosh/HOLOPHANE%20HID%20HIGH%20NAYS%20PRODUCT%20CATALOG.pdf"
page = "https://acomee.com.mx/catalogos/catalogosh/HOLOPHANE%20HID%20HIGH%20NAYS%20PRODUCT%20CATALOG.pdf"
shows = "a maker's sheet: Holophane HID High Bays product catalog (Acuity Brands; a recent catalogue, metal halide), Enduratron and Prismalume dimension drawings: prismatic borosilicate glass reflectors, open or enclosed by a glass lens, with or without a spun-on aluminium cover, under a cast aluminium ballast housing"
class = "limited"
licence = "Acuity Brands Lighting (Holophane), all rights reserved"
sampled = false
sha1 = ""
notes = "Limited: looked at only, no SHA-1. Read in the PDF text and from rendered images of pp. 12 and 22. Modern, but the same Holophane construction the 1960s units used: glass reflector (Endural prismatic borosilicate, wall at least 3 mm), spun aluminium cover option, cast aluminium ballast housing, reflector held by three 5 mm steel rods and a ring of 6 mm rod (Prismalume). The 'enclosed optic' closes the bowl with glass; the lens's own size is not given."

[[ref]]
url = "https://www.lamptech.co.uk/Documents/Manuals/OsramSylvania%20-%20Engineering%20Bulletin%20-%20Mercury%20-%201996%20US.pdf"
