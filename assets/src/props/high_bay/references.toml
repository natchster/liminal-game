# The references of high_bay (docs/design/ASSETS.md), gathered on 2026-11-17
# by a research agent. `class`: "free" (CC0, public domain, CC BY / CC BY-SA
# with its attribution: may be sampled into a texture; given with the SHA-1 of
# the file at its url) or "limited" (all rights reserved, fair use: looked at
# and measured, never sampled, never committed; its sha1 is left empty); a
# free one never sampled (a document, a page) says `sampled = false` and needs
# no SHA-1. `cargo xtask asset refs high_bay` fetches them into
# target/asset-refs/high_bay/. The palette is photo-sampled (mean of a patch
# of the photo scaled to the width a note gives), each sample in its own
# photo's light. No free photograph of an unlit prismatic refractor was found:
# that sample is missing. The SHA-1s were checked by downloading each original
# and running `shasum`, except where a note says otherwise.

[[ref]]
url = "https://upload.wikimedia.org/wikipedia/commons/2/2c/Industrial_ceiling_lamp_2.jpg"
page = "https://commons.wikimedia.org/wiki/File:Industrial_ceiling_lamp_2.jpg"
shows = "the thing, in place: a ceiling-hung industrial mercury-vapour lamp in a disused mechanical workshop (Gaseberg, Lysekil, Sweden), lamp off: a deep spun-aluminium bowl reflector, dull and dusty outside with spinning marks, bright satin inside, a white (by its look phosphor-coated) bulb in its throat, under a long louvred steel ballast box bolted to the corrugated ceiling"
class = "free"
licence = "CC0 1.0, W.carter"
sha1 = "80e4d559c32daa5eae00442c0fc327d3e2b6c22f"
notes = "Best view of the reflector and the ballast box together, side-lit by daylight. Open bottom (no refractor). Size and wattage not stated: the reflector looks smaller than a 22 in high bay (unmeasured). The box: dark painted sides with louvres, a pale galvanised underside spotted with old screw holes. Photographed 2018-04-21. Viewed at 960 px and in full (4173 x 2348). Palette source for the reflector inside and out and the box."

[[ref]]
