[[ref]]
url = "https://upload.wikimedia.org/wikipedia/commons/8/8e/Ceiling_in_old_disused_mechanical_workshop.jpg"
page = "https://commons.wikimedia.org/wiki/File:Ceiling_in_old_disused_mechanical_workshop.jpg"
shows = "a place with it in: the ceiling of the same old mechanical workshop, now storage, several of these lamps on their boxes among a spiral air duct, a ceiling fan and discoloured, sagging asbestos-cement ceiling boards"
class = "free"
licence = "CC BY-SA 4.0, W.carter"
sha1 = "271045972610143c5af8a1420e56c79d774e5e8c"
notes = "How they are spaced in a low hall: in rows a few metres apart, each box fixed straight to the ceiling, conduit between them. The description says the hall was used for cutting and welding. Photographed 2016-12-02 (tone-mapped HDR). Viewed at 960 px."

[[ref]]
url = "https://upload.wikimedia.org/wikipedia/commons/6/64/Industrial_Holophane_pendant_light.jpg"
page = "https://commons.wikimedia.org/wiki/File:Industrial_Holophane_pendant_light.jpg"
shows = "the refractor's glass: an industrial Holophane caged pendant, lit, its prismatic glass bowl (fine vertical prisms over the sides, horizontal rings toward the bottom) inside a cast guard, on a die-cast aluminium housing with cooling fins, a threaded ring and a hook"
class = "free"
licence = "CC BY 3.0, Marie-Lan Nguyen"
sha1 = "8600659f413df278a9bf1fffb83b67c74fa93c32"
notes = "Not a high bay (a smaller caged pendant), kept for the Holophane prismatic glass lit from inside and for bare die-cast aluminium worn to a dull patina with dark pits. Its glass only shows lit: no unlit sample. Date and place of the fixture not stated; photographed 2014-12-06. Viewed at 960 px and in full (2671 x 4000)."

[[ref]]
url = "https://upload.wikimedia.org/wikipedia/commons/8/81/Behrens-aeg-werkstattleuchte.jpg"
page = "https://commons.wikimedia.org/wiki/File:Behrens-aeg-werkstattleuchte.jpg"
shows = "the enamel: an AEG workshop pendant (named on its file page a Behrens AEG 'Werkstattleuchte') with a wide shallow reflector, glossy dark brown outside, white enamel inside chipped dark at the rim, against a white wall"
class = "free"
licence = "CC BY-SA 3.0, Christos Vittoratos"
sha1 = "f1c5e85d5530cc2c4471d46bdea973edac45bb84"
notes = "For the porcelain-enamel reflector option only: an older incandescent workshop lamp (its date not stated; Behrens's AEG work is pre-1914 by general knowledge), not a mercury high bay. The outer finish's material is not stated (unverified). SHA-1 from the Commons file page (API); the original could not be re-downloaded (HTTP 429), so it is not re-checked here. Viewed at 960 px."

[[ref]]
url = "https://upload.wikimedia.org/wikipedia/commons/3/37/Lampa_rt%C4%99ciowa_produkcji_POLAMP_-1.jpg"
page = "https://commons.wikimedia.org/wiki/File:Lampa_rt%C4%99ciowa_produkcji_POLAMP_-1.jpg"
shows = "the lamp, unlit: a 250 W phosphor-coated mercury lamp (POLAMP, Poland) on paper, ellipsoidal white-coated outer bulb, clear neck with the arc-tube mount and lettering, large brass screw base (E40 by its look)"
class = "free"
licence = "CC BY-SA 4.0, Koefbac"
sha1 = "46d07315771a40521d9bee5b8e04f0e9eb92d31a"
notes = "A 250 W, so smaller than the 400 W BT37 (ref 10, 11 for its size), but the same build: coating stops at the neck, which is clear. Under-exposed: the white paper beside it reads (155,159,164), so the coating reads a little warmer and darker than the paper. Photographed 2017-01-23. Viewed at 960 px and in full (2592 x 1944)."

[[ref]]
url = "https://upload.wikimedia.org/wikipedia/commons/7/7e/Mercury_fluorescent_lamp_%D0%94%D0%A0%D0%9B400.JPG"
page = "https://commons.wikimedia.org/wiki/File:Mercury_fluorescent_lamp_%D0%94%D0%A0%D0%9B400.JPG"
shows = "the lamp, lit: a 400 W phosphor-coated mercury lamp (Soviet DRL-400) standing base-down in a white socket on a carpet, wired to bare gear on the floor"
class = "free"
licence = "Public domain (PD-self), Andreyanov Denis (Андреянов Денис)"
sha1 = "457a49d122522387be67a62e06ca316d16527ace"
