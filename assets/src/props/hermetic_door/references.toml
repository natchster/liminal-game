shows = "a maker's sheet: the ОЗОЗС catalogue of ДУ doors (серия 01.036-1, ТУ 25.99.21-005-52404267-2018), a type table with opening sizes and masses, and series drawings of ДУ-IV-2, ДУ-III-5, ДУ-II-2 and ДУ-IV-3 (elevation, sections А-А and Б-Б)"
class = "limited"
licence = "ООО «ОЗОЗС» (exp-plant.ru), all rights reserved"
notes = "Drawings viewed and measured, e.g. https://exp-plant.ru/public/uploads/pages/24548fc42a060dd039dca0975a7199bccbf.jpg (ДУ-IV-2), .../245346fb730e0cea7c65d2d071bd8a90d4f.jpg (ДУ-III-5), .../245f83f865454c668d6d840399ba1bc130e.jpg (ДУ-II-2). They give frame and leaf outer sizes, overall depth, the two hinges and their spacing, and the gear layout: a central bevel gearbox with screw rods running to wedges at the top and bottom. The sections show the leaf as a face plate with channel ribs and the seal in a channel. The sections are schematic, not to scale. The page also says doors are set 150 mm above the finished floor. Catalogue photo f2532.jpg shows the rib side with its gearbox and rods."

