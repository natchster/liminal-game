notes = "Read only. Quotes: the closing gear 'Включает в себя конический редуктор, винтовые тяги с клиньями и двумя штурвалами (рукоятками)' and 'Располагается с внутренней стороны изделия и обеспечивает открывание и закрывание с обеих сторон'; the seal 'уплотнителем из пористой резины, расположенным по периметру полотна'; the frame (комингс) carries the load to the walls. This conflicts with ref 13, which puts the seal on the frame."

[[ref]]
url = "https://www.elesa.com/siteassets/PDF/PDF_EN/DIN%20950.pdf"
page = "https://www.elesa.com/siteassets/PDF/PDF_EN/DIN%20950.pdf"
shows = "a measurement: Elesa+Ganter datasheet for DIN 950 cast-iron spoked handwheels: rim diameter, rim section, hub size and spoke count"
class = "limited"
licence = "Elesa S.p.A. / Ganter Norm, all rights reserved"
notes = "Read and drawing viewed. A generic engineering standard for spoked handwheels, used for the wheel's proportions: the d1 = 250 mm row has a 26 mm rim section, a 45 mm hub of 28 mm length, a 50 mm overall dish, and 5 spokes. Wheels of 200 mm and under have 3 spokes. Sizes of 315, 400 and 500 mm are special executions. The rim is a turned oval section."

