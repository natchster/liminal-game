# The references of hermetic_door (docs/design/ASSETS.md), gathered on
# 2026-11-16 by a research agent (its notes: docs/research/doors.md);
# `cargo xtask asset refs hermetic_door` fetches them into
# target/asset-refs/hermetic_door/. Its surfaces are painted from its own
# palette (`core_props::doors`), never sampled from these; the palette is
# photo-sampled, each photo's light in it.

[[ref]]
url = "https://upload.wikimedia.org/wikipedia/commons/2/26/Germa-1.jpg"
page = "https://commons.wikimedia.org/wiki/File:Germa-1.jpg"
shows = "the thing: a grey hermetic door (гермодверь) to the shaft of bunker ЧЗ-703, Moscow, standing open about 90 deg in a wide steel frame cast into a concrete wall, with a red 4-spoke handwheel (штурвал) at mid-height and a small red latch lever on the closing edge"
class = "free"
licence = "CC BY-SA 4.0, Petr.efimenko"
sha1 = "d8dcbf99057a8992135051a1c247a4e9b121ede0"
notes = "Viewed (1920 px thumb). The only free photo found of a Soviet hermetic door worked by a central wheel. Shows a flat leaf face, a 4-spoke wheel with a round rim and a hub nut, the wheel's shadow showing that it stands proud of the face, pale ochre drip streaks running down the grey enamel, a steel floor plate across the threshold, and peeling plaster on the concrete reveal. The wheel size is estimated from this photo."

[[ref]]
url = "https://upload.wikimedia.org/wikipedia/commons/0/0a/Door_DG-3.JPG"
page = "https://commons.wikimedia.org/wiki/File:Door_DG-3.JPG"
shows = "the thing: a cream hermetic door stencilled ДГ-3 (дверь герметическая) in a missile command post (Strategic Missile Forces Museum, Ukraine), with a red 3-spoke handwheel, red ОТКР/ЗАКР arrows round the wheel, a stencilled register box and a vertical pull handle"
class = "free"
licence = "CC BY 3.0, Michael"
sha1 = "accec1252d3b68a46a9516e5537b775ed409cb2a"
notes = "Viewed (960 px thumb). Best reference for the stencils: 'ДГ·3', 'ПРИ ОТКРЫТЫХ ДЗГ 1,2 НЕ ОТКРЫВАТЬ!' and a box reading 'Рег.№ 24/028 / Р.раз. 250кгс / Не более 3-х чел. / Ср.оч.осв.', in red on cream. Shows a 3-spoke wheel, a raised panel inside the leaf border, and paint chipped down to a dark undercoat near the handle. The warm tungsten light tints the whole frame orange."

[[ref]]
url = "https://upload.wikimedia.org/wikipedia/commons/0/08/Underground_Moscow_museum_-_2026-05_-_p01.jpg"
page = "https://commons.wikimedia.org/wiki/File:Underground_Moscow_museum_-_2026-05_-_p01.jpg"
shows = "the thing: a red-brown hermetic door stencilled 'ГЕРМОДВЕРЬ' with a ringed '1', with four wedge-clamp levers (задрайки) painted red, two near the top and two near the bottom, white 0/3 arrows at each lever, and horizontal channel ribs across the face (bunker museum 'Подземная Москва')"
class = "free"
licence = "CC0, Александр Сигачёв"
sha1 = "a22ecf0ff9b7fcdc87c0cf728ea0184a30a2f37f"
notes = "Viewed (1920 px thumb). Main reference for the lever-clamp type: each lever is a flat bar on a hex boss, with a white arrow marking its open and closed positions. Shows white stencil lettering, the red-brown paint, the leaf set in a steel frame in a rough black-painted wall, and a sign above it reading 'Узел связи (секретный бункер)'."

[[ref]]
url = "https://upload.wikimedia.org/wikipedia/commons/4/4d/Underground_Moscow_museum_-_2026-05_-_p52.jpg"
page = "https://commons.wikimedia.org/wiki/File:Underground_Moscow_museum_-_2026-05_-_p52.jpg"
shows = "the thing, inside face: a large hermetic leaf swung open, showing its grid of welded channel ribs (4 x 4 cells), a dark rubber seal in a channel round the leaf perimeter with rounded corners, lever clamps with red handles, a stencilled '№1' on a rib, a dark green-grey steel frame (коробка) round the opening, and heavy barrel hinges with protruding pins"
class = "free"
licence = "CC0, Александр Сигачёв"
