page = "https://hkz.ru/catalog/collective-protection/protective-hermetic-doors-menu/259-protective-hermetic-door-du"
shows = "a maker's sheet: Химкомплектзащита ДУ protective-hermetic door: the parts and what each does, the closing gear and the seal"
class = "limited"
