[[ref]]
url = "https://files.stroyinf.ru/Data1/11/11507/index.htm"
page = "https://files.stroyinf.ru/Data1/11/11507/index.htm"
shows = "a measurement: Правила эксплуатации защитных сооружений гражданской обороны (Приказ МЧС России от 15.12.2002 N 583): door colour, door numbering, shelter signs, and seal care"
class = "free"
licence = "Public domain (official normative act, ГК РФ ст. 1259 п. 6), МЧС России"
sampled = false
notes = "Read, not sampled. §3.2.10: metal doors and shutters are painted with synthetic paints, ЗГД, ГД, shutters, gates and КИД in grey, and the rubber seal parts must not be painted. §6.2.2: each door gets a sequence number ('Дверь N 1') in white paint on both faces. §6.2.1 (also read on zakonbase.ru/content/part/292684): the entrance sign is at least 50 x 60 cm, white field, black letters 3-5 cm high. §6.2.3: route arrows are 50 x 15 cm, white with 'УБЕЖИЩЕ' and the distance in metres. §4.2.4: all clamps should press the leaf with about equal force."

[[ref]]
