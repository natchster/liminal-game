# Where the lift doors stand, and why (docs/design/ASSETS.md, *Things the
# layout makes*): the core props make a working and a dead lift a floor
# (`core_props::builders`) and a broken one on half the floors
# (`core_props::tail`), against a wall.
by = "layout"
count = [1, 3]
levels = [4, 999]

[[rule]]
at = "lift"
purposes = ["*"]
why = "an office floor has its lifts against a wall, wherever its rooms are, and the floor kept them"

[[rule]]
at = "broken lift"
purposes = ["*"]
why = "one of the floor's lifts was forced open and left that way"
