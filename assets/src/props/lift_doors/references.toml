# The references of lift_doors (docs/design/ASSETS.md), gathered on
# 2026-11-16 by a research agent (its notes: docs/research/doors.md);
# `cargo xtask asset refs lift_doors` fetches them into
# target/asset-refs/lift_doors/. Its surfaces are painted from its own
# palette (`core_props::doors`), never sampled from these; the palette is
# photo-sampled, each photo's light in it.

