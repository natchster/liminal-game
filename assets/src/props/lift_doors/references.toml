[[ref]]
url = "https://www.access-board.gov/adaag-1991-2002.html"
page = "https://www.access-board.gov/adaag-1991-2002.html"
shows = "a measurement: 1991 ADA Accessibility Guidelines, 4.10 Elevators (hall call buttons, hall lanterns, jamb floor characters, sill gap)"
class = "free"
licence = "Public domain (US federal government work), U.S. Access Board"
sampled = false
notes = "The US rules in force for 1990s-2000s buildings: buttons centred at 42 in (1065 mm), at least 3/4 in (19 mm); lantern centreline at least 72 in (1830 mm); jamb characters 2 in high at 60 in; car-to-landing sill gap at most 1-1/4 in (32 mm). Read on the page."

[[ref]]
url = "https://cdn.standards.iteh.ai/samples/9962/909cde1184fc464c9410a0d301170809/ISO-4190-1-1980.pdf"
page = "https://standards.iteh.ai/catalog/standards/iso/4ff46617-2f08-42a9-a931-b7370c5c5c3f/iso-4190-1-1980"
shows = "a measurement: ISO 4190/1-1980 Table 1, standard electric lifts class I; office (non-residential) column gives car, door and well sizes for 630-1600 kg"
class = "limited"
licence = "ISO, all rights reserved (iTeh preview)"
notes = "Office lifts: 630 and 800 kg have 800 x 2000 mm centre-opening doors; 1000, 1250 and 1600 kg have 1100 x 2100 mm. Read from a rendered image of the table on page 6 of the preview."

[[ref]]
url = "https://www.kone.co.uk/Images/KONE-MonoSpace-4-DX-Core-and-Pro-Planning-Guide-GBIR_tcm45-139450.pdf"
page = "https://www.kone.co.uk/Images/KONE-MonoSpace-4-DX-Core-and-Pro-Planning-Guide-GBIR_tcm45-139450.pdf"
shows = "a maker's sheet: KONE MonoSpace 4 DX planning guide (EN 81-20/50); centre-opening KES 202/602 tables, door types and frame widths"
class = "limited"
licence = "KONE Corporation, all rights reserved"
notes = "Clear widths 600-1100 mm, heights 2000/2100/2200/2300 mm; centre-opening raw opening width = clear width + 300 mm; frame 120 mm at the sides and 150 mm at the head, narrow frame 50 mm all round. A current product, but these opening sizes have not changed. Read in the PDF text."

[[ref]]
url = "https://elevator.mitsubishi-electric.vn/documents/43/01_NexWay_Product_Guide.pdf"
page = "https://elevator.mitsubishi-electric.vn/documents/43/01_NexWay_Product_Guide.pdf"
shows = "a maker's sheet: Mitsubishi NexWay product guide, Hall Designs (jamb types E-102 narrow, E-202 square, E-302 splayed, E-212/E-312 with transom), finishes and hall fixtures"
class = "limited"
licence = "Mitsubishi Electric Corporation, all rights reserved"
notes = "Landing doors and jambs come in hairline stainless (SUS-HL) or painted steel sheet. The landing sill is extruded hard aluminium as standard, stainless optional. Buttons are hairline stainless with an LED halo in yellow-orange, white or blue. Read in the PDF text. Gives no fixture sizes in mm."

[[ref]]
url = "https://shop-us.tkelevator.com/media/download_files/component_manuals/traditional_entrance.pdf"
page = "https://shop-us.tkelevator.com/media/download_files/component_manuals/traditional_entrance.pdf"
shows = "a maker's sheet: TK Elevator / Vertical Express Traditional Entrance Installation Manual (single-speed, two-speed and centre-opening hoistway entrances); sill profile drawing, gibs, clearances"
class = "limited"
licence = "Vertical Express (TK Elevator), all rights reserved"
notes = "Landing sill set 1-1/4 in from the car sill. Doors hung with a 1/4 in shim under each edge and a 1/4 in shim between the panel's leading edge and the frame column. Gibs run in the sill groove with 1/8 in clearance. Each panel has two gibs and one safety retainer. Figure 2 shows the extruded sill with two grooves and a nose. Read in the text and in rendered figures."

[[ref]]
url = "https://online2.ogs.ny.gov/dnc/masterspec24/docs/Division14ConveyingEquipment/142821.0ElevatorHoistwayEntrances.docx"
page = "https://online2.ogs.ny.gov/dnc/masterspec24/docs/Division14ConveyingEquipment/142821.0ElevatorHoistwayEntrances.docx"
shows = "a measurement: New York State OGS MasterSpec Section 142821 Elevator Hoistway Entrances (passenger entrance frames, door panels, sills, gibs)"
class = "limited"
licence = "New York State Office of General Services, all rights reserved (no licence stated)"
notes = "Door panels are flush hollow metal at least 1-1/4 in thick, with 16-gauge faces and vertical stiffeners at most 8 in apart. Frames are #14 USS gauge. The one-piece extruded aluminium sill is at least 3/4 in thick, with a nosing about 1 in deep. Two plastic gibs per panel. Centre-opening doors carry sight guards on the meeting edges. Read in the document text."

[[ref]]
url = "https://digital.brochure.tkelevator.com/brochure/eox1b/series-50-landing-fixtures/"
page = "https://digital.brochure.tkelevator.com/brochure/eox1b/series-50-landing-fixtures/"
shows = "a maker's sheet: TK Elevator Series 50 landing operating panels and indicators (EOX brochure), sizes W x H x D"
class = "limited"
licence = "TK Elevator, all rights reserved"
notes = "LOP 51 call station 91 x 171 x 19 mm with a brushed stainless faceplate. LID 50 direction indicator 91 x 101 x 19 mm. LIP 50 position indicator 260 x 91 x 19 mm. A current product: older fixtures were often longer. Read on the page."

[[ref]]
url = "https://files.technicalsafetybc.ca/v3/assets/bltdec2ded849740f4d/bltf03159085b512f72/6332706b8804663c59ee9c7d/16111_-_Incident_Summary_Report_II-952859-2019_(16111)_Final.pdf"
page = "https://www.technicalsafetybc.ca/regulatory-resources/incident-investigations/elevator-car-and-hoistway-door-sustained-damage-due-impact-motorized-scooter"
shows = "how a broken one looks: incident report of a landing door forced into the shaft by a scooter hitting it about 11 in above the floor; the gibs and safety retainer failed, the lower door section was bent, corroded gib screws; photos of a bent gib bracket and the bottom of the door"
class = "limited"
licence = "Technical Safety BC, all rights reserved"
notes = "The real failure mode of a forced landing door: the bottom is pushed into the shaft, the gib brackets bend out of the sill groove and the panel hangs from its top track. Read in the text, photos 3-5 viewed."

