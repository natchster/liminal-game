[[ref]]
url = "https://goagilix.com/wp-content/uploads/2024/08/Emerson-Appleton-catalog-v-51-incandescent-luminaires-appleton-en-us-7437050.pdf"
page = "https://goagilix.com/wp-content/uploads/2024/08/Emerson-Appleton-catalog-v-51-incandescent-luminaires-appleton-en-us-7437050.pdf"
shows = "a maker's sheet: Appleton (Emerson) V-51 incandescent luminaires catalogue, February 2024, pp. 296-304: enclosed and gasketed fixtures for tunnels, storage areas and chemical plants; materials, globes, guards and a dimension table (A, B, C, D) for the pendant, ceiling, wall and box-mounted types"
class = "limited"
licence = "Emerson Electric Co. (Appleton), all rights reserved"
sampled = false
sha1 = ""
notes = "Limited: looked at only, no SHA-1. Read in the PDF text and from a rendered image of page 303 (the dimension drawings). Malleable iron mounting hood and globe adapter (zinc, chromate, epoxy powder coat), porcelain socket, glass globe (clear, amber, blue, green, opal, red; VGL-1 for 60-150 W, VGL-2 for 150-300 W), zinc-plated steel wire guard (VWG-1 for A21, VWG-2 for PS30) that snaps into two recesses of the adapter. A current catalogue, but the same V-51 series and catalogue numbers (VA1050, VC1050, VGA1050...) are listed in the 1970 Graybar catalogue (ref 8). A, B, C are read from the drawings: C the outside diameter of globe and guard, A from the top of the globe adapter to the bottom of the guard, B the guard below the adapter; that reading of A and B is mine (unverified)."

[[ref]]
url = "https://www.americanradiohistory.com/Archive-Catalogs/Graybar/Graybar-Condensed-Catalog-29-1970.pdf"
page = "https://www.americanradiohistory.com/Archive-Catalogs/Graybar/Graybar-Condensed-Catalog-29-1970.pdf"
shows = "a maker's sheet of the era: Graybar Electric Condensed Catalog No. 29 (1970), p. 30 Crouse-Hinds Vaporgard incandescent fixtures (VDA pendant, VDC through-feed, VXHF/VXH ceiling, VXHT/VXHBF wall), p. 31 Crouse-Hinds VMV mercury vaportight, p. 130 Appleton V-51 vaportight series, guards and reflectors"
class = "limited"
licence = "Graybar Electric Company, all rights reserved (1970 catalogue, scanned by americanradiohistory.com)"
sampled = false
sha1 = ""
notes = "Limited: looked at only, no SHA-1. Read in the PDF text (OCR) and rendered pages (PDF pp. 42-43 and 146). The Crouse-Hinds Vaporgard globe and guard come off as one unit, take incandescent lamps A-21 to PS-25 (25-300 W) and fit 3-1/4 and 4 in outlet boxes; 'used in industrial locations ... walkways, bridges, tunnels ... cold storage facilities, garages and processing plants'. Appleton V-51 reflectors are 12, 14 and 16 in for 100, 150 and 200-300 W. No dimension drawings of the fixtures themselves."

