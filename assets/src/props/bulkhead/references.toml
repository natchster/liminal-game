# The references of bulkhead (docs/design/ASSETS.md), gathered on 2026-11-17
# by a research agent. `class`: "free" (CC0, public domain, CC BY / CC BY-SA
# with its attribution: may be sampled into a texture; given with the SHA-1 of
# the file at its url) or "limited" (all rights reserved, fair use: looked at
# and measured, never sampled, never committed; its sha1 is left empty); a
# free one never sampled (a document, a page) says `sampled = false` and needs
# no SHA-1. `cargo xtask asset refs bulkhead` fetches them into
# target/asset-refs/bulkhead/. The palette is photo-sampled (mean of a patch
# of the photo scaled to 960 px wide, unless a note says otherwise), each
# sample in its own photo's light. The SHA-1s were checked by downloading
# each original and running `shasum`.

[[ref]]
url = "https://upload.wikimedia.org/wikipedia/commons/f/f9/Kokerei_Hansa_%2849%29.jpg"
page = "https://commons.wikimedia.org/wiki/File:Kokerei_Hansa_(49).jpg"
shows = "the thing, decayed in place: a vapour-tight fixture under a concrete ceiling of the disused Hansa coking plant (Dortmund), seen from below at an angle; weathered cast box with a conduit hub and a rusted conduit arm, a rust-scaled threaded guard ring with a bolt and lug, a ribbed glass jar (yellow-green, dusty) and a galvanised cast/wire guard of four hoops and vertical bars over it"
class = "free"
licence = "CC BY-SA 4.0, 1971markus (1971markus@wikipedia.de)"
sha1 = "97d24a5767b4c97fed44ccbeee68b95cf7c12408"
notes = "The best photograph of the thing as it is found: paint gone from the box (pale grey zinc/aluminium with white bloom), the guard ring rusted through its coating, cobweb and dust in the ribs of the jar, the guard still galvanised with rust only at the joints. The jar's yellow tint may be an amber globe or a yellow lamp seen through clear glass: unverified. The make is not stated. Photographed 2017-12-02. Viewed at 960 px and in full (3600 x 4240). Palette source for the cast box, the rusted ring, the guard and the jar."

[[ref]]
url = "https://upload.wikimedia.org/wikipedia/commons/9/9a/Industrial_Decay_-_Cage_Light_with_Nest.jpg"
page = "https://commons.wikimedia.org/wiki/File:Industrial_Decay_-_Cage_Light_with_Nest.jpg"
shows = "the thing, abandoned: a pendant jelly-jar on a conduit stem under the timber purlins and corrugated roof of an abandoned industrial building (USA; Will County, Illinois by its EXIF coordinates, unverified); a round cast canopy carrying a bird's nest, a cylindrical glass jar with a domed end and a bulb visible inside, a rusty wire guard of vertical bars and hoops"
class = "free"
licence = "CC BY-SA 3.0, bsmalley"
sha1 = "8f2cef8a6eedcc5261bc667bec6ffd6af19cce3b"
notes = "Black and white (desaturated) photograph, March 2015: its palette samples are luminance only. The American jelly-jar shape: the jar is roughly 1.5 times as long as it is wide (estimated from the photo, foreshortened), the guard follows it down to a small bottom ring. Viewed at 960 px and in full (2496 x 1872)."

[[ref]]
url = "https://upload.wikimedia.org/wikipedia/commons/4/44/Diefenbunker_Tunnel.JPG"
page = "https://commons.wikimedia.org/wiki/File:Diefenbunker_Tunnel.JPG"
shows = "a place with it in: the corrugated-steel blast (entrance) tunnel of the Diefenbunker (CFS Carp, Ontario; a Cold War bunker, built 1959-61 by general knowledge, not stated on the file page), a row of lit vapour-tight fixtures hung from conduit along the crown of the arch; in full resolution each one is a cast box with conduit hubs, a threaded guard ring and a glass globe, with cobweb"
class = "free"
licence = "CC BY-SA 3.0, SamuelDuval"
sha1 = "5ea6d2c80abbe4b8cc30ade651e625d72f22e3df"
notes = "How they are spaced and hung in a tunnel: one on the crown about every few corrugation bays, on rigid conduit with the cable run beside it; pipes along the walls. The globes are lit and clip to white; the box reads warm from its own lamp. Photographed 2012-01-08 (the bunker as a museum). Viewed at 960 px and in full (5015 x 3343), lamp nearest the camera cropped at 2250-2750 x 250-850."

[[ref]]
url = "https://upload.wikimedia.org/wikipedia/commons/e/e1/Blast_tunnel_entrance_at_CFS_Carp.jpg"
page = "https://commons.wikimedia.org/wiki/File:Blast_tunnel_entrance_at_CFS_Carp.jpg"
shows = "a place with it in: the same Diefenbunker blast tunnel from the other end, the lit fixtures on the crown of the corrugated arch receding into haze, a pipe along the right wall"
class = "free"
licence = "CC BY-SA 3.0, Jonathon Simister"
sha1 = "fa5a9c1250b58960f84c686a355637312dbe683d"
notes = "Mood and light reference: each globe throws a bright pool on the corrugations around it and the tunnel goes dim between them. Over-exposed around the lamps; not used for palette. Photographed 2011-08-25. Viewed at 960 px and in full (4320 x 3240)."

[[ref]]
url = "https://upload.wikimedia.org/wikipedia/commons/6/64/Industrial_Holophane_pendant_light.jpg"
page = "https://commons.wikimedia.org/wiki/File:Industrial_Holophane_pendant_light.jpg"
shows = "a related fixture: an industrial Holophane caged pendant, die-cast aluminium (hook, finned housing, threaded ring) with a cast rib guard (ribs meeting in a bottom boss) over a prismatic glass globe, lit"
class = "free"
