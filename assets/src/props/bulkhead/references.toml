sha1 = "8600659f413df278a9bf1fffb83b67c74fa93c32"
notes = "Not the jelly-jar itself (a larger pendant with a prismatic globe), but the cast guard and the bare die-cast aluminium, worn to a dull patina with dark pitting, are the materials of the cast-guard variant. Hung against a plain wall (a salvaged lamp; date and place of the fixture not stated). Photographed 2014-12-06. Viewed at 960 px and in full (2671 x 4000)."

[[ref]]
url = "https://upload.wikimedia.org/wikipedia/commons/d/d9/%C5%81%C3%B3d%C5%BA_fotowarsztaty_D%C4%99tka_lampa_02.05.10_p.jpg"
