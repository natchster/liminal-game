sha1 = "311f55ae8e3731e4b34f7926ec07a87a8359215c"
notes = "How a Cold War cableway is laid: the trays on the walls, the lamps alone on the crown between them, one about every few metres (by eye; the vanishing row is 7 or more lamps). A large-format (4 x 5 in) black and white negative: luminance only. The date of the photograph is not on the file page (the HAER survey of SLC-3 is from 1993, unverified for this frame); the tunnel itself dates from the complex's building, c. 1960 (general knowledge, unverified). In full resolution the trays have perforated (diamond-pattern) sheet sides with a splice joint every few metres: ventilated trough trays rather than ladders, the same rails and cables in kind. Too dark (low key) for palette samples. Viewed at 960 px and in full (5000 x 4011, TIFF); trays cropped at 100-2400 x 200-2400."

