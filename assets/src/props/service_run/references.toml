[[ref]]
url = "https://galileo.phys.virginia.edu/research/groups/hep/aag/nova/cable_trays/cooper_bline_catalog.pdf"
page = "https://galileo.phys.virginia.edu/research/groups/hep/aag/nova/cable_trays/cooper_bline_catalog.pdf"
shows = "a maker's sheet: Cooper B-Line, Cable Tray Systems catalogue CT-10 (2010): the Series 1 steel ladder tray (side rail, loading depth, widths, rung spacing, lengths, finishes), the rung profiles and loads, the NEMA load classes, support span and splice rules (NEMA VE 1 / VE 2), and the trapeze support kits"
class = "limited"
licence = "Cooper B-Line, Inc., all rights reserved (copy hosted by the University of Virginia physics department)"
sampled = false
sha1 = ""
notes = "Limited: looked at only, no SHA-1. Read in the PDF text and from rendered pages (printed pp. 27-29, 39-41, 204-205, 243 and 265; the PDF's page is the printed one plus 2). Series 1 steel ladder tray: 148 (3 in NEMA loading depth) side rail 3.625 in tall with a 0.875 in flange, 18 gauge, actual loading depth 3.077 in; 156 (4 in) rail 4.188 in, 16 gauge, loading depth 3.628 in. Widths 6, 9, 12, 18, 24, 30, 36 in (overall width = width + 1/8 in); rung spacing 6, 9 or 12 in; lengths 12 ft (primary) and 10 ft. Finishes: pre-galvanised (ASTM A653 G90) or hot-dip galvanised after fabrication (ASTM A123). 'Larger, less flexible cables are typically installed in ladder type cable trays having 9 or 12 in rung spacing'; NEMA load ratings are based on 12 in rungs. The side rail is a C-channel, its flanges turned in toward the tray (from the drawing on p. 204; the AP-5/AP-6 rail charts not read). The Series 1 steel rung (p. 29) is a channel 1.5 in across, 1 in across its top, 1/2 in deep (read from a small drawing; its exact shape unverified). Support span no longer than the straight section, so 'not more than one splice between supports' (NEMA VE 1 / VE 2, pp. 27-28 and 39). Trapeze support kit (p. 243 aluminium, p. 265 steel series): for a 12 in tray, one B22 strut (B-Line's 1-5/8 in, 12 gauge channel: general knowledge, unverified) cut to 22 in (559 mm), two hold-down guide clamps on the rails, 'designed for use with 1/2 in threaded rod' (3/8 in hardware optional), four nuts and square washers. The catalogue says B-Line Systems was formed in 1956; the tray itself is a current design, its 1950s-70s forebears similar in kind (unverified)."

