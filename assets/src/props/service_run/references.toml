shows = "a place with it in, of the era: the cable tray tunnel of Space Launch Complex 3 West, Vandenberg Air Force Base (California), a corrugated steel arch tunnel; cable trays in four or five tiers along both walls, full of cables; a row of vapour-tight lamps on short stems down the middle of the crown; a timber plank walkway"
class = "free"
