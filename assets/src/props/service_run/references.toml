# The references of service_run (docs/design/ASSETS.md), gathered on
# 2026-11-17 by a research agent. `class`: "free" (CC0, public domain, CC BY /
# CC BY-SA with its attribution: may be sampled into a texture; given with the
# SHA-1 of the file at its url) or "limited" (all rights reserved, fair use:
# looked at and measured, never sampled, never committed; its sha1 is left
# empty); a free one never sampled (a document, a page) says `sampled = false`
# and needs no SHA-1. `cargo xtask asset refs service_run` fetches them into
# target/asset-refs/service_run/. The palette is photo-sampled (mean of a patch
# of the photo scaled to 960 px wide, unless a note says otherwise), each sample
# in its own photo's light. The SHA-1s were checked by downloading each original
# and running `shasum` (each also matches the sha1 Commons reports for it).
# Inches are given as the documents give them, with millimetres (1 in = 25.4 mm).

[[ref]]
url = "https://upload.wikimedia.org/wikipedia/commons/1/13/Services_duct_%288663196366%29.jpg"
page = "https://commons.wikimedia.org/wiki/File:Services_duct_(8663196366).jpg"
shows = "the thing in its place: a services duct (utility tunnel) in Milan, looking along it; a board-marked concrete slab ceiling with four or five lagged pipes along it, each hung on a trapeze of two threaded rods and a cast-iron pipe roll (double nuts under it), painted black and rusting; perforated galvanised cable trays in tiers on wall brackets down both walls, grey PVC cables in them; bulkhead lamps on the right wall under the trays; a green enclosure on the right (a busbar, by the file's Commons category)"
class = "free"
licence = "CC BY-SA 2.0, Marco d'Itri (Flickr 8663196366)"
sha1 = "9a04185bb15846d24e1b507bd1f5b22e1d9aca49"
notes = "The best photograph of the run as it is laid: pipes on the crown, cables on the walls, and no lamp on the crown at all (the lamps sit on the wall under the lowest tray, so the crown runs are lit from the side and below). The trapezes here are pipe rolls (a spool between the two rods on which the pipe can slide as it expands), one per pipe, the rods running up into the slab; rust shows red where the paint is worn on the rolls and at the rod ends. The pipes are lagged (insulation jackets, not bare steel), so their diameters are not the steel's. Hanger spacing not measurable (foreshortened). Phone photograph, 2013-03-28, warm lamp light from the right. Viewed at 960 px and in full (1944 x 2592). Palette source for the roll, the rust, the slab and the galvanised tray."

[[ref]]
