# Where a service run is, and why (docs/design/ASSETS.md, *Things the layout
# makes*): the floor's layout lays one along each straight corridor of the
# Utility Halls long enough to carry one (`World::lay_runs`,
# `world::lining`); one no rule allows is not laid.
by = "layout"
count = [0, 60]
levels = [6, 999]

[[rule]]
at = "run"
purposes = ["*"]
why = "a plant's service tunnel carries its cables and pipes along its crown, as the cableways did"

[never]
purposes = ["empty"]
why = "the emptiness is the content (PILLARS 1): a tunnel left empty keeps its bare crown"
