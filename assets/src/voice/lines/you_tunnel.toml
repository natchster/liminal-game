# What you tell yourself on the way in (personas/you_tunnel.toml;
# docs/design/WAY_IN.md, Your voice; docs/design/VOICES.md, Your voice on
# the way in).
#
# `use` is the way in's (`modes::tunnel_voice`); `subject` when it is said:
# `look`, in the look into the tunnel, on its clock, in order; `walk`, as
# you walk, in order, each after the last and a pause; the rest once each,
# at what you pass or do (`long` 485 m walked; `light` the dead bar a third
# time; `back` walking back once the arch has gone; `quiet` the cars
# stopped; `locked` the shut door tried; `keep` all told and no door yet;
# `door` the open door seen; `note` near her note; `taken` her note taken).
# Only what he knows: never her name, his, or the man's before her; never
# what the tunnel or the door is (docs/design/LORE.md, "Your own voice, on
# the way in"). Numbers are said as words.
persona = "you_tunnel"

[[line]]
id = "look_1"
text = "This is where she came. Every night, for nineteen nights."
emotion = "resolve"
intensity = 0.3
use = "way_in"
subject = "look"
levels = [1, 1]
takes = 4

[[line]]
id = "look_2"
text = "Eleven o'clock, down these stairs, with a measuring wheel and a notebook."
emotion = "resolve"
intensity = 0.3
use = "way_in"
subject = "look"
levels = [1, 1]
takes = 4

[[line]]
id = "look_3"
text = "She said the city goes quiet here. Just the fans, and the cars."
emotion = "wary"
intensity = 0.3
use = "way_in"
subject = "look"
levels = [1, 1]
takes = 4

[[line]]
id = "look_4"
text = "Four hundred and eighty-five meters. It says so on the wall."
