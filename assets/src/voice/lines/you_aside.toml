# What you say to yourself (personas/you_aside.toml; docs/VOICES.md,
# Your asides).
#
# `use` is the event the voice director answers (audio::asides::Use);
# `subject` what it is about within its use (the place, the kind of thing),
# whose lines are chosen before the use's general ones; `levels` the levels
# it may be said on (1-3 the Building, 4 the Lobby, 5 and down the rooms).
# A line reacts and never explains: never a creature's name or what it
# does, a rule, a place's name or number, the way, an instruction.
persona = "you_aside"

# ---- arriving: a few seconds after your first steps on a floor

# the Well: the first floor, the first words of a run
[[line]]
id = "arrive_well_keeps_going"
text = "It just keeps going."
emotion = "wary"
intensity = 0.4
use = "arrive"
subject = "well"
levels = [1, 1]
takes = 4

