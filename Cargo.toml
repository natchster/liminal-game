[workspace]
resolver = "3"
members = ["crates/engine", "crates/game", "crates/backrooms", "crates/placers", "crates/placers/placers_*", "xtask"]
# `cargo run` / `cargo build` without -p: the game
default-members = ["crates/backrooms"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
# ---- workspace crates
engine = { path = "crates/engine" }
game = { path = "crates/game" }
placers = { path = "crates/placers" }
placers_kit = { path = "crates/placers/placers_kit" }
placers_bathroom = { path = "crates/placers/placers_bathroom" }
placers_core = { path = "crates/placers/placers_core" }
placers_domestic = { path = "crates/placers/placers_domestic" }
placers_industrial = { path = "crates/placers/placers_industrial" }
placers_nature = { path = "crates/placers/placers_nature" }
placers_occult = { path = "crates/placers/placers_occult" }
placers_office = { path = "crates/placers/placers_office" }
placers_party = { path = "crates/placers/placers_party" }
placers_toys = { path = "crates/placers/placers_toys" }
placers_victorian = { path = "crates/placers/placers_victorian" }
# ---- external
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSArray", "NSDictionary", "NSValue", "NSGeometry", "NSObject", "NSProcessInfo"] }
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
winit = "0.30"
raw-window-handle = "0.6"
cpal = "0.18"
miniz_oxide = "0.9"
rustfft = "6"
# correctly rounded math (CORE-MATH): the same result on every system (engine::dmath)
core-math = "1.4"
serde_json = { version = "1", features = ["float_roundtrip"] }
# ---- tooling (xtask, tests)
nv-flip = "0.1"
png = "0.18"
ebur128 = "0.1"
base64 = "0.23"
toml = { version = "1", default-features = false, features = ["parse", "std", "serde"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# literals in geometry and tuning tables are kept exactly as authored, even
# where they are close to a std constant (changing them would change levels)
approx_constant = "allow"
excessive_precision = "allow"
# `!(a < b)` is deliberate where NaN must take the other branch
neg_cmp_op_on_partial_ord = "allow"
# numeric code indexes several parallel arrays in one loop
needless_range_loop = "allow"
# scene handles are hashed by node id, not by their mutable contents
mutable_key_type = "allow"
too_many_arguments = "allow"
# identical branches are deliberate where the condition draws a random number
if_same_then_else = "allow"
# `x < lo ? lo : x > hi ? hi : x` never panics, unlike `f64::clamp` when lo > hi
manual_clamp = "allow"
comparison_chain = "allow"
field_reassign_with_default = "allow"
should_implement_trait = "allow"
type_complexity = "allow"
# a lint silenced in the code says why (`#[expect(lint, reason = "…")]`, or
# `allow` where it holds in some builds only, as in shared test helpers)
allow_attributes_without_reason = "warn"
# `let … else` for a binding that returns early on the other case
manual_let_else = "warn"
# the current language's own forms: names inline in a format string,
# `copied` for Copy values, or-patterns nested
uninlined_format_args = "warn"
cloned_instead_of_copied = "warn"
unnested_or_patterns = "warn"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false
panic = "unwind"
