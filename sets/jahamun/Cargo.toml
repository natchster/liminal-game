[package]
name = "jahamun"
description = "The Jahamun Tunnel set: the approach to the portal at night and the 485 m walkway inside, behind the glass, built apart from the game"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file = "../../LICENSE"

# The set itself (as the game would take it): no window, no Metal device.
[lib]
path = "src/lib.rs"

# The set on its own: a window to walk it, or headless frames.
[[bin]]
name = "jahamun"
path = "src/main.rs"

[dependencies]
engine = { path = "../../crates/engine" }
miniz_oxide = "0.9"
serde_json = "1"
# the binary's only: the Metal device and command buffers
objc2 = "0.6"
objc2-metal = "0.3"

[lints]
workspace = true
