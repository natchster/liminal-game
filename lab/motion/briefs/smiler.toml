# The Smiler's moves, one brief each (docs/design/ENTITIES.md, the Smiler:
# Idle → Alert → Search → Hunt → Strike → Withdraw). Kimodo is given plain
# human motion in its own words ("A person ..."): it was trained on people
# and knows nothing of the wrong. What makes the motion the Smiler's is laid
# on top in the viewer (its stoop, its long limbs, the head before the body,
# the held frames: `lab/viewer/src/smiler.rs`).
#
# `candidates` seeds are sampled from `seed`; the bake keeps the one that
# best fits `speed` (the root's mean speed, m/s, on the mocap's own scale)
# with the least foot skating and jitter; `loop` clips are cut where they
# best repeat and cross-faded there.

[defaults]
title = "The Smiler"
steps = 100
cfg = 2.0
candidates = 4
seed = 1000

# The body supplies the posture, the prompt only the motion: the Smiler is
# bound in its stoop, so a prompt that asks for a hunch stacks a second stoop
# on the first. Every clip is laid on the body as its turn away from this
# stance (`neutral`): a person upright and still, arms at their sides.
[[clip]]
name = "stand"
for = "the stance every clip is measured from (the body's rest pose is its stoop)"
prompt = "A person stands upright and completely still, with arms relaxed at their sides, looking straight ahead."
seconds = 3.0
speed = [0.0, 0.05]
neutral = true

[[clip]]
name = "idle"
for = "Idle: in its dark, facing a corner; it barely moves, and the little it does is weight"
prompt = "A tall, heavy person stands upright and still, arms hanging at their sides, slowly and heavily shifting their weight from one foot to the other."
seconds = 8.0
loop = true
speed = [0.0, 0.12]

[[clip]]
name = "look"
for = "Alert: it has seen a light, and its head goes to it before its body does"
prompt = "A tall person standing upright and still slowly turns their head to the right to look at something, then holds it there."
seconds = 4.0
speed = [0.0, 0.2]

[[clip]]
name = "creep"
for = "Search: to where your light went out, slower, unsure where you are"
prompt = "A heavy person walks forward slowly and deliberately with an upright posture, placing each foot down heavily, arms hanging at their sides."
seconds = 6.0
loop = true
speed = [0.3, 0.9]

[[clip]]
name = "listen"
for = "Search, arriving: it stops where the light was and listens"
prompt = "A heavy person stops walking, stands upright and completely still, and tilts their head slightly to one side as if listening."
seconds = 4.0
speed = [0.0, 0.4]

[[clip]]
name = "stalk"
for = "Hunt, the approach: long strides, leaning in"
prompt = "A tall, heavy person walks forward steadily with long, heavy strides and an upright posture, arms hanging loosely."
seconds = 5.0
loop = true
speed = [1.3, 2.2]
candidates = 6

[[clip]]
name = "run"
for = "Hunt: you are lit and in its sight; it comes at 4.5 m/s, faster than your walk"
# (asked for heavy, pounding strides, its back foot kicked up high: a blind review preferred this one, its feet low)
prompt = "A person sprints forward as fast as they can."
seconds = 5.0
loop = true
# more seeds: a run must loop cleanly
candidates = 8
speed = [2.6, 4.5]

[[clip]]
name = "lunge"
for = "Strike: a sharp inhale, coiling as it comes, then the lunge (7 m/s over at most 4 m)"
# (asked to lunge heavily, it ran into it: a blind review preferred this one, its weight sinking into its knees first)
prompt = "A person bends their knees, then quickly steps forward and grabs at something in front of them with both hands."
seconds = 3.0
speed = [0.5, 3.0]
# on its feet: a lunge that ends lying on the floor is no use to it
min_hips = 0.6

[[clip]]
name = "stand_over"
for = "Over your body: it stands over you and looks down"
prompt = "A tall person stands upright and bends their head down to look at the ground in front of their feet."
seconds = 4.0
speed = [0.0, 0.3]

# (Dropped when the clips went into the game: `turn`, a person turning round
# on the spot, and `back_away`, walking backwards then away. Its brain turns
# it and its planted feet step round with it; it withdraws walking ahead.
# Their samples stay cached under their briefs in the first lab commit.)
