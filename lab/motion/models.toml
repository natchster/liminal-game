# The models the lab's motion pipeline uses, each pinned to a revision and
# kept in the Hugging Face cache (never this repository):
# `.venv/bin/python motion.py fetch` downloads them, `motion.py doctor`
# checks them (docs/research/character-motion.md has why these).
#
# Only motion data leaves this pipeline (lab/motion/clips/*.motion); no
# model is shipped. The licence that governs what it makes is the motion
# model's: NVIDIA's Open Model License (commercial use allowed; the SEED
# checkpoint is trained only on the public BONES-SEED mocap, and its card
# says "ready for commercial use"). The text encoder only turns a prompt
# into the 4096 numbers that condition the motion model; it is Meta Llama 3
# (Community License: "Built with Meta Llama 3") with McGill's LLM2Vec
# adapters (MIT), converted to GGUF by LocalAI (its NOTICE and the Llama
# licence are kept in the cache with it).

[[model]]
id = "kimodo-soma-seed"
role = "motion"
does = "text-conditioned kinematic motion diffusion on NVIDIA's 30-joint SOMA skeleton, 30 fps, up to 10 s"
repo = "nvidia/Kimodo-SOMA-SEED-v1.1"
revision = "aae3af194322c60d21bc44062b64c3fec912be50"
include = ["model.safetensors", "config.yaml", "stats/**", "LICENSE", "README.md"]
licence = "NVIDIA Open Model License"

[[model]]
id = "llm2vec-llama3-q8"
role = "text"
does = "the prompt's embedding: bidirectional Llama-3-8B (LLM2Vec), mean-pooled, Q8_0"
repo = "LocalAI-io/Llama-3-Kimodo-GGML"
revision = "f583f3ee2b093f6d9ec524463b4152622abf11a6"
include = ["Llama-3-Kimodo-Q8_0.gguf", "tokenizer.gguf", "LICENSE-META-LLAMA-3.txt", "NOTICE", "MANIFEST.json", "SHA256SUMS"]
weights = "Llama-3-Kimodo-Q8_0.gguf"
weights_sha256 = "b26d0e74b115b33a7f2df5aca04426548365e99217cd590986f8abc4172e4c5c"
tokenizer_sha256 = "81614aca62a98846c02b72cc2e5378e5bdce8b4d507b88f96eb1faa90dae607e"
licence = "Meta Llama 3 Community License; LLM2Vec adapters MIT"

# The runtime: kimodo-mlx (MIT), pinned in pyproject.toml to
# NomaDamas/kimodo-mlx@bbb592aa2046361be541ab4f5e2b0e9ba4869b21: its MLX
# denoiser and its LLM2Vec layer, read before use. Not kimodo-turbo: its
# repository states no licence.

# MotionBricks (`bricks.py`): the motion between two clips, its bridges.
# The NVIDIA Open Model Agreement ("permits commercial use and
# redistribution of modified models"); trained on Bones RigPlay 1. Two
# backends, one tensor interface; `MOTIONBRICKS_BACKEND=mlx|cuda` chooses,
# else the platform: on Apple Silicon the MLX port, natchster/motionbricks-mlx
# (Apache-2.0, pinned in pyproject.toml), on these weights (the revision it
# was checked against NVIDIA's PyTorch on)...
[[model]]
id = "motionbricks-soma"
role = "bridges"
does = "motion in-betweening on the 30-joint SOMA skeleton: four poses of a body and up to four it should reach, the motion between (0.6-1.9 s at 30 Hz)"
repo = "nvidia/MotionBricks"
revision = "3cb362d9b95aa40462abcb4d8cfae9ffb6d97410"
include = ["soma/**"]
licence = "NVIDIA Open Model Agreement"
backend = "mlx"

# ...on Linux with an NVIDIA GPU, NVIDIA's own graph of the same model
# (NVlabs/motionbricks v0.2.0, Apache-2.0 code; the graph's weights the
# agreement's) on ONNX Runtime's TensorRT or CUDA provider (`uv sync --group
# cuda`), and the rig's rest offsets its rotations are turned through.
# Fetched into target/lab/motion/files/ by `motion.py fetch`, checked by size
# and SHA-256 (both are Git LFS objects upstream: their media URLs).
[[file]]
id = "motionbricks-soma-onnx"
backend = "cuda"
source = "NVlabs/motionbricks@54fc563a (v0.2.0)"
url = "https://media.githubusercontent.com/media/NVlabs/motionbricks/54fc563aeaaf819a753d72cc9fdc6713989cdd43/motionbricks/assets/onnx/soma/mmm_v6_soma_fp32.onnx"
sha256 = "856419dc72aeb14e591eebf4dd0ea05734a2506ddb00bcd39dd6dac2ad60f4fb"
size = 757864273

[[file]]
id = "motionbricks-soma-rig"
backend = "cuda"
source = "NVlabs/motionbricks@54fc563a (v0.2.0)"
url = "https://media.githubusercontent.com/media/NVlabs/motionbricks/54fc563aeaaf819a753d72cc9fdc6713989cdd43/tools/onnx/assets/soma_model_rig.npz"
sha256 = "a3a349e4dd10b13731528c8613bd564629df9b8444201bd9278a5c414ffd2b40"
size = 1184

