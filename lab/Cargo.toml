# The lab: a workspace of its own, apart from the game's (`lab/README.md`).
# It reads the game's crates (the engine, the bodies) and changes nothing in
# them; the game's build, its check and its fixtures never see it.
[workspace]
resolver = "3"
members = ["viewer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
