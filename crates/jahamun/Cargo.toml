[package]
name = "jahamun"
description = "The Jahamun Tunnel: the way in. The approach to the portal at night and the walkway inside, behind the glass (the game's prologue, crates/jahamun/README.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

# The place itself, as the game takes it: no window, no Metal device.
[lib]
path = "src/lib.rs"

# The place on its own: a window to walk it, or headless frames.
[[bin]]
name = "jahamun"
path = "src/main.rs"

[dependencies]
engine = { workspace = true }
miniz_oxide = { workspace = true }
serde_json = { workspace = true }
# the binary's only: the Metal device and command buffers
objc2 = { workspace = true }
objc2-metal = { workspace = true }

[lints]
workspace = true
