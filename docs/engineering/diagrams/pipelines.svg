<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d">
  <title id="t">The pipelines</title>
  <desc id="d">Three lanes feed one set of gates: the asset pipelines build the game's meshes, textures and voices from their sources; changes are made by agents under hooks and checked on every stop; playtests by bots, by the visual tour, by recordings and by people find what the gates cannot. What any lane finds becomes a check (the steering loop).</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9d977f"/>
    </marker>
    <marker id="y" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e3cf6e"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #d9d2b4; font-size: 12.5px; }
    .h1 { font-size: 22px; font-weight: 700; fill: #f1e9c6; }
    .sub { font-size: 13px; fill: #9d977f; }
    .lane { font-size: 15px; font-weight: 700; }
    .h3 { font-size: 13.5px; font-weight: 700; fill: #f1e9c6; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #c9c2a4; }
    .muted { fill: #9d977f; font-size: 12px; }
    .card { fill: #1c1a14; stroke: #3a3628; stroke-width: 1; }
    .box { fill: #25221a; stroke: #5b5440; stroke-width: 1.2; }
    .flow { stroke: #9d977f; stroke-width: 1.8; fill: none; }
  </style>

  <rect width="1200" height="800" rx="16" fill="#14130f"/>
  <text x="32" y="46" class="h1">The pipelines</text>
  <text x="32" y="68" class="sub">Assets, changes and playtests each end in the same gates; what any of them finds becomes a check, so the game keeps changing without breaking.</text>

  <!-- lane: assets -->
  <rect x="32" y="88" width="898" height="170" rx="12" class="card"/>
  <circle cx="54" cy="112" r="6" fill="#d9a441"/>
  <text x="68" y="117" class="lane" style="fill:#d9a441">Assets</text>
  <text x="140" y="117" class="muted">every mesh, texture, voice and cutscene is built from a source in the repository</text>

  <rect x="48" y="132" width="196" height="112" rx="8" class="box"/>
  <text x="60" y="153" class="h3">Sources</text>
  <text x="60" y="174">Blender scripts of the props</text>
  <text x="60" y="191">MakeHuman CC0 bodies</text>
  <text x="60" y="208">CC0 photographs</text>
  <text x="60" y="225">voice personas and lines</text>
  <path d="M245 188 H265" class="flow" marker-end="url(#a)"/>

  <rect x="268" y="132" width="196" height="112" rx="8" class="box"/>
  <text x="280" y="153" class="h3">Built by xtask</text>
  <text x="280" y="175" class="mono">assets props|creatures</text>
  <text x="280" y="193" class="mono">assets textures</text>
  <text x="280" y="211" class="mono">voice build, eval</text>
  <text x="280" y="229" class="mono">cutscene write</text>
  <path d="M465 188 H485" class="flow" marker-end="url(#a)"/>

  <rect x="488" y="132" width="196" height="112" rx="8" class="box"/>
  <text x="500" y="153" class="h3">Judged</text>
  <text x="500" y="174">meshes compared part by part</text>
  <text x="500" y="191">voices: words, tone and</text>
  <text x="500" y="208">emotion against their targets</text>
  <text x="500" y="225">cutscenes: their contract</text>
  <path d="M685 188 H705" class="flow" marker-end="url(#a)"/>

  <rect x="708" y="132" width="196" height="112" rx="8" class="box"/>
  <text x="720" y="153" class="h3">Embedded</text>
  <text x="720" y="174">in the binary, none of it</text>
  <text x="720" y="191">read from a file at run time,</text>
  <text x="720" y="208">each with its licensed</text>
  <text x="720" y="225">manifest entry</text>

  <!-- lane: changes -->
  <rect x="32" y="274" width="898" height="170" rx="12" class="card"/>
  <circle cx="54" cy="298" r="6" fill="#e3cf6e"/>
  <text x="68" y="303" class="lane" style="fill:#e3cf6e">Changes</text>
  <text x="152" y="303" class="muted">made by coding agents with the project's own skills, hooks and reviewers</text>

  <rect x="48" y="318" width="196" height="112" rx="8" class="box"/>
  <text x="60" y="339" class="h3">The work</text>
  <text x="60" y="360">an issue, read through its</text>
  <text x="60" y="377">trusted brief; a milestone</text>
  <text x="60" y="394">of the plan; a content skill</text>
  <text x="60" y="411" class="mono">add-zone, add-prop, …</text>
  <path d="M245 374 H265" class="flow" marker-end="url(#a)"/>

  <rect x="268" y="318" width="196" height="112" rx="8" class="box"/>
  <text x="280" y="339" class="h3">An agent edits</text>
  <text x="280" y="360">under hooks: only inside</text>
  <text x="280" y="377">the repository, recorded</text>
  <text x="280" y="394">fixtures only by re-recording,</text>
  <text x="280" y="411">every edit formatted</text>
  <path d="M465 374 H485" class="flow" marker-end="url(#a)"/>

  <rect x="488" y="318" width="196" height="112" rx="8" class="box"/>
  <text x="500" y="339" class="h3">The quick check</text>
  <text x="500" y="360">on every stop: formatting,</text>
  <text x="500" y="377">the trust tool, clippy and</text>
  <text x="500" y="394">the fast tests; a failure</text>
  <text x="500" y="411">sends the agent back</text>
  <path d="M685 374 H705" class="flow" marker-end="url(#a)"/>

  <rect x="708" y="318" width="196" height="112" rx="8" class="box"/>
  <text x="720" y="339" class="h3">Review</text>
  <text x="720" y="360">read-only reviewers, each</text>
  <text x="720" y="377">seeing one kind of evidence:</text>
  <text x="720" y="394">blind A/B frames, the canon,</text>
  <text x="720" y="411">the levels, the sound, a diff</text>

  <!-- lane: playtests -->
  <rect x="32" y="460" width="898" height="170" rx="12" class="card"/>
  <circle cx="54" cy="484" r="6" fill="#5fbf72"/>
  <text x="68" y="489" class="lane" style="fill:#5fbf72">Playtests</text>
  <text x="160" y="489" class="muted">the game played, by bots, by the tour and by people: what a gate alone cannot see</text>

  <rect x="48" y="504" width="196" height="112" rx="8" class="box"/>
  <text x="60" y="525" class="h3">Bots play</text>
  <text x="60" y="546">whole runs from New Game;</text>
  <text x="60" y="563">a cautious bot, death on;</text>
  <text x="60" y="580">personas; a rule-follower</text>
  <text x="60" y="597">that must beat the floors</text>
  <path d="M245 560 H265" class="flow" marker-end="url(#a)"/>

  <rect x="268" y="504" width="196" height="112" rx="8" class="box"/>
  <text x="280" y="525" class="h3">The visual playtest</text>
  <text x="280" y="546">the walkable floor's edges</text>
  <text x="280" y="563">toured and looked at: gaps,</text>
  <text x="280" y="580">flicker, clipping, things</text>
  <text x="280" y="597">out of place</text>
  <path d="M465 560 H485" class="flow" marker-end="url(#a)"/>

  <rect x="488" y="504" width="196" height="112" rx="8" class="box"/>
  <text x="500" y="525" class="h3">Recordings</text>
  <text x="500" y="546">any stretch kept and played</text>
  <text x="500" y="563">back exactly: a bug, frames</text>
  <text x="500" y="580">for a review, a save cut at</text>
  <text x="500" y="597">any moment, a benchmark</text>
  <path d="M685 560 H705" class="flow" marker-end="url(#a)"/>

  <rect x="708" y="504" width="196" height="112" rx="8" class="box"/>
  <text x="720" y="525" class="h3">People</text>
  <text x="720" y="546">playtest sessions: fear,</text>
  <text x="720" y="563">sound and taste are theirs</text>
  <text x="720" y="580">to judge, and their verdicts</text>
  <text x="720" y="597">calibrate the reviewers</text>

  <!-- the gates -->
  <path d="M905 188 H946" class="flow" marker-end="url(#a)"/>
  <path d="M905 374 H946" class="flow" marker-end="url(#a)"/>
  <path d="M905 560 H946" class="flow" marker-end="url(#a)"/>
  <rect x="950" y="88" width="218" height="542" rx="12" class="card" style="stroke:#5b5440"/>
  <text x="968" y="117" class="lane" style="fill:#f1e9c6">The gates</text>
  <text x="968" y="140" class="mono" style="fill:#e3cf6e">cargo xtask check</text>
  <text x="968" y="168">formatting, clippy, trust</text>
  <text x="968" y="190">every test, each in a</text>
  <text x="968" y="208">process of its own</text>
  <text x="968" y="230">20 reference levels rebuilt</text>
  <text x="968" y="248">draw for draw</text>
  <text x="968" y="270">golden frames and their</text>
  <text x="968" y="288">look against the art bible</text>
  <text x="968" y="310">the levels' expressive range</text>
  <text x="968" y="332">the performance budgets</text>
  <text x="968" y="354">listening and loudness</text>
  <text x="968" y="376">pacing, whole playthroughs</text>
  <path d="M1059 394 V444" stroke="#e3cf6e" stroke-width="2" fill="none" marker-end="url(#y)"/>
  <rect x="966" y="448" width="186" height="164" rx="8" class="box" style="stroke:#e3cf6e"/>
  <text x="980" y="472" class="h3" style="fill:#e3cf6e">main</text>
  <text x="980" y="494">a commit a milestone,</text>
  <text x="980" y="512">pushed and bundled</text>
  <text x="980" y="534">others' pull requests pass</text>
  <text x="980" y="552">the trust gate; the agents'</text>
  <text x="980" y="570">tooling changes only by</text>
  <text x="980" y="588">its maintainers</text>

  <!-- the steering loop -->
  <path d="M1059 632 V652 H16 V374 H44" stroke="#e3cf6e" stroke-width="1.8" stroke-dasharray="6 5" fill="none" marker-end="url(#y)"/>
  <rect x="32" y="668" width="1136" height="108" rx="12" class="card"/>
  <text x="52" y="697" class="lane" style="fill:#e3cf6e">The steering loop</text>
  <text x="52" y="722">What any lane finds goes back into the work: a mistake made twice becomes a rule, a lint, a test or a step in a skill, so it cannot happen a third time.</text>
  <text x="52" y="744">Recorded reference data changes only by re-recording, with its reason; the weekly drift sweep reads every gate into the content ledger and the quality</text>
  <text x="52" y="762">scorecard, and what people caught becomes a check.</text>
</svg>
